<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Certificate Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 50px auto; 
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .box { 
            background: #16213e; 
            border: 2px solid #0f3460;
            padding: 20px; 
            margin: 20px 0; 
            border-radius: 8px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #c23b4f; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔐 SSL Certificate Test</h1>
    
    <div class="box">
        <h2>Step 1: Accept API Certificate</h2>
        <p>Click this button to test the API connection. You'll need to accept the certificate warning.</p>
        <button onclick="testAPI()">Test API Connection (192.168.0.102)</button>
        <div id="result"></div>
    </div>

    <div class="box">
        <h2>Step 2: Return to Login</h2>
        <p>Once the API test succeeds, click below to go to the login page:</p>
        <button onclick="window.location.href='/auth/login'">Go to Login Page</button>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing connection to https://192.168.0.102...</p>';
            
            try {
                const response = await fetch('https://192.168.0.102/api/v1/healthz');
                const data = await response.json();
                
                if (data.status === 'ok') {
                    resultDiv.innerHTML = `
                        <p class="success">✅ SUCCESS! API connection working!</p>
                        <p>Response: ${JSON.stringify(data)}</p>
                        <p><strong>You can now use the login page!</strong></p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Unexpected response: ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Connection failed: ${error.message}</p>
                    <p><strong>This means you haven't accepted the certificate yet!</strong></p>
                    <p>The browser blocked the request. You need to:</p>
                    <ol>
                        <li>Open a new tab</li>
                        <li>Visit: <a href="https://192.168.0.102/api/v1/healthz" target="_blank" style="color: #e94560;">https://192.168.0.102/api/v1/healthz</a></li>
                        <li>Accept the security warning</li>
                        <li>Come back here and click "Test API Connection" again</li>
                    </ol>
                `;
            }
        }
    </script>
</body>
</html>
