[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Minimum Python version
minversion = 7.0

# Command line options
addopts =
    -ra
    -v
    --strict-markers
    --strict-config
    --tb=short

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests
    db: Tests requiring database
    redis: Tests requiring redis
    api: API endpoint tests
    auth: Authentication tests
    chart: Chart engine tests
    ai: AI service tests
    payment: Payment integration tests

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract
